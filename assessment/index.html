<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30x30 Assessment Explorer</title>
    <meta name="description" content="Explore California's 2025 30x30 Biodiversity Assessment for the whole state or any ecoregion, county, district or drawn area: habitats, species richness, connectivity, freshwater and climate features by conservation status, computed with fixed, reviewable SQL.">
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/boettiger-lab/geo-agent@v3.35.0/app/assets/favicon.svg">

    <script src="https://unpkg.com/maplibre-gl@5.22.0/dist/maplibre-gl.js"
        integrity="sha384-U054LTKiMIJKEecR8PKFiUZdvkGWHjfPBnen5hSmR9TwfOfgZmKbskC8Rs9dCm/1"
        crossorigin="anonymous"></script>
    <link href="https://unpkg.com/maplibre-gl@5.22.0/dist/maplibre-gl.css" rel="stylesheet"
        integrity="sha384-MGCxhspF/+ufueUgol3FDkiAYQbpSNRhBT0VWHJt64U8qIy9qlnXWx8LAbj6niPH"
        crossorigin="anonymous" />
    <script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"
        integrity="sha384-MjejsnWXHmuz93aE35YWLh5AbS/6ceRB3Vb+ukOwqFzJRTpQ8vvbkLbNV7I0QK4f"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SchmidtDSE/glen-charts@v0.2.10/core/style.css">
    <link rel="stylesheet" href="app/style.css">
</head>

<body>
    <header id="app-header">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <h1>30x30 Biodiversity Assessment Explorer</h1>
            <span class="brand-sub">California's 2025 assessment, for the state or any area</span>
        </div>
        <nav class="header-links">
            <a href="https://cabiodiversitynetwork.org/wp-content/uploads/2026/08/CBN-Biodiversity-Assessment-2025-Final-Report.pdf" target="_blank" rel="noopener">Read the report</a>
            <a href="https://ca-30x30.nrp-nautilus.io/" target="_blank" rel="noopener" title="Ask open-ended questions of the same data with an AI data assistant">Ask the data (AI explorer)</a>
            <a href="https://github.com/boettiger-lab/ca-30x30/tree/main/assessment" target="_blank" rel="noopener">GitHub</a>
        </nav>
    </header>

    <main id="glen"></main>

    <script type="module">
        import { createExplorer } from 'https://cdn.jsdelivr.net/gh/SchmidtDSE/glen-charts@v0.2.10/core/explorer.js';
        import extensions from './app/extensions.js';
        createExplorer({ extensions });
    </script>
</body>

</html>
