apiVersion: apps/v1
kind: Deployment
metadata:
  name: ca-30x30
  namespace: biodiversity
  labels:
    app: ca-30x30
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ca-30x30
  template:
    metadata:
      labels:
        app: ca-30x30
    spec:
      # Two replicas on distinct nodes: a single NotReady node must not take
      # the app down.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: ca-30x30
            topologyKey: kubernetes.io/hostname
      initContainers:
      - name: git-clone
        image: alpine/git:2.52.0
        command:
        - sh
        - -c
        - |
          # Clone YOUR app repo (the GitHub repo you created from the template).
          # Update this URL to point to your own GitHub repo:
          # Update this URL to point to your own GitHub repo:
          git clone --depth 1 https://github.com/boettiger-lab/ca-30x30.git /tmp/repo
          cp /tmp/repo/index.html /usr/share/nginx/html/
          cp /tmp/repo/docs.html /usr/share/nginx/html/
          cp /tmp/repo/layers-input.json /usr/share/nginx/html/
          cp /tmp/repo/system-prompt.md /usr/share/nginx/html/
          cp -r /tmp/repo/assets /usr/share/nginx/html/
          # The no-LLM Assessment Explorer at /assessment/ (#137). The GitHub Pages copy
          # redirects here since #158, so it must be served from this pod too.
          cp -r /tmp/repo/assessment /usr/share/nginx/html/
          # Curated STAC catalog served at /stac/catalog.json and read by
          # ca30x30-mcp as STAC_CATALOG_URL (ca-30x30#126).
          cp -r /tmp/repo/stac /usr/share/nginx/html/
          # The shared nginx snippets (glen-ops#340), pinned like the GLEN version.
          git clone --depth 1 --branch nginx-v2 https://github.com/SchmidtDSE/glen-template.git /tmp/glen
          cp /tmp/glen/nginx/* /glen-nginx/
        volumeMounts:
        - name: website-content
          mountPath: /usr/share/nginx/html
        - name: glen-nginx
          mountPath: /glen-nginx
      containers:
      - name: nginx
        image: nginx:1.31.9-alpine
        ports:
        - containerPort: 80
        # STAC-only listener for ca30x30-mcp (k8s/configmap.yaml).
        - containerPort: 8090
          name: stac
        env:
        - name: TMPDIR
          value: "/tmp"
        # Per-app values for the shared nginx snippets (glen-template nginx/render.sh).
        - name: GLEN_APP
          value: "ca-30x30"
        - name: LLM_UPSTREAM
          value: "http://open-llm-proxy.biodiversity.svc.cluster.local:8002"
        - name: MCP_UPSTREAM
          value: "http://ca30x30-mcp.biodiversity.svc.cluster.local:8000"
        - name: MCP_HOST
          value: "ca30x30-mcp.nrp-nautilus.io"
        - name: MCP_TILES_SOURCE
          value: "https://ca30x30-mcp.nrp-nautilus.io/tiles/"
        # Dedicated replica scoped to this app's curated catalog (k8s/mcp.yaml,
        # ca-30x30#126). config.json is generated from this at pod start and
        # runtime config wins, so this is the effective value.
        # Same-origin MCP path: nginx proxies it to the shared server and
        # attaches the bearer token, so the browser never holds the token
        # (geo-query#453). Absolute, because GLEN does new URL(mcp_url).
        - name: MCP_SERVER_URL
          value: "https://ca-30x30.nrp-nautilus.io/api/mcp"
        - name: MCP_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: duckdb-mcp-auth
              key: MCP_AUTH_TOKEN
        - name: LLM_ENDPOINT
          value: "https://open-llm-proxy.nrp-nautilus.io/v1"
        - name: PROXY_KEY
          valueFrom:
            secretKeyRef:
              name: open-llm-proxy-app-keys
              key: ca-30x30
        # Renders the shared snippets and this app's server block, writes
        # config.json, and starts nginx.
        command: ["sh", "/glen-nginx/render.sh"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
        - name: website-content
          mountPath: /usr/share/nginx/html
        - name: nginx-template
          mountPath: /nginx-template
          readOnly: true
        - name: nginx-conf-d
          mountPath: /etc/nginx/conf.d
        - name: glen-nginx
          mountPath: /glen-nginx
          readOnly: true
        - name: config-template
          mountPath: /config
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: website-content
        emptyDir: {}
      - name: config-template
        configMap:
          name: ca-30x30-config
      - name: nginx-template
        configMap:
          name: ca-30x30-nginx
      - name: nginx-conf-d
        emptyDir: {}
      - name: glen-nginx
        emptyDir: {}
