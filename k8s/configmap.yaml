# LLM config template — NO SECRETS.
#
# The upstream LLM proxy key lives only in the nginx config (see
# `ca-30x30-nginx` below), which injects the Authorization header
# server-side via `proxy_set_header`. The browser only sees a relative
# `/api/llm` endpoint and never holds the key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ca-30x30-config
  namespace: biodiversity
data:
  config.template.json: |
    {
        "mcp_server_url": "${MCP_SERVER_URL}",
        "llm_model": "deepseek-v4-flash",
        "transcription_model": {
            "value": "gemma-small",
            "endpoint": "/api/llm",
            "api_key": "unused"
        },
        "llm_models": [
            {
                "value": "deepseek-v4-flash",
                "label": "NRP DeepSeek V4 Flash",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "glm-5",
                "label": "NRP GLM-5.2",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "kimi",
                "label": "NRP Kimi",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "qwen3",
                "label": "NRP Qwen3",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "qwen3-small",
                "label": "NRP Qwen3 Small",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "gpt-oss",
                "label": "NRP GPT-OSS 120B",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "minimax-m2",
                "label": "NRP MiniMax M2",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "gemma",
                "label": "NRP Gemma",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "gemma-small",
                "label": "NRP Gemma Small",
                "endpoint": "/api/llm",
                "api_key": "unused"
            }
        ]
    }

---
# Nginx configuration — reverse-proxies /api/llm/ to open-llm-proxy and
# injects the Authorization header from ${PROXY_KEY} at container start
# (the startup command runs envsubst over this file). The browser never
# receives the key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ca-30x30-nginx
  namespace: biodiversity
data:
  nginx.conf.template: |
    # ── Per-client limits on the LLM and MCP paths (glen-ops#246) ──
    # $client_addr is the last X-Forwarded-For entry, the one HAProxy appends
    # from the connection it actually received, so a client cannot choose it by
    # sending its own header. In-cluster callers have no XFF and fall back to
    # $remote_addr. Values from proxy-log measurements (glen-template#50).
    map $http_x_forwarded_for $client_addr {
        "~(?:^|,)\s*(?<last>[^,\s]+)\s*$" $last;
        default $remote_addr;
    }
    limit_req_zone $client_addr zone=llm:10m rate=60r/m;
    limit_req_zone $client_addr zone=mcp:10m rate=60r/m;
    limit_conn_zone $client_addr zone=addr:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Accept";

        # ── Reverse proxy to open-llm-proxy ─────────────
        # Clients POST to /api/llm/chat/completions with a dummy bearer
        # token; nginx rewrites the Authorization header using the
        # ${PROXY_KEY} substituted in at container startup. The browser
        # never receives the key.
        #
        # In-cluster upstream (geo-agent-ops#73): proxy the open-llm-proxy
        # ClusterIP service directly over HTTP inside the cluster, NOT its
        # public hostname (open-llm-proxy.nrp-nautilus.io). Routing through the
        # public ingress exposed the app to NRP's heterogeneous edge: nginx
        # latched onto a single flapping anycast VIP and hard-failed ~12% of
        # /api/llm connects (502/504 "while connecting to upstream") for a
        # resolver window — invisible in the proxy logs because the request
        # died here, at the app's nginx, before reaching the proxy. It also
        # subsumes the earlier IPv6-unreachable failure the #64 IPv4-forcing
        # block worked around: an in-cluster ClusterIP is IPv4 and single-VIP,
        # so both failure modes disappear. The Origin header still forwards by
        # default, so proxy logging/routing is unchanged.
        #
        # Cross-namespace apps (e.g. schmidtdse) use this same FQDN; the
        # ClusterIP is reachable cluster-wide. The service lives only in the
        # biodiversity namespace: ClusterIP open-llm-proxy:8002 (http).
        # Only two calls are relayed (glen-ops#246): POST chat/completions
        # (chat and transcription) and GET models. Any other path or method
        # under /api/llm/ is answered here and never reaches the proxy.
        location = /api/llm/chat/completions {
            limit_except POST { deny all; }
            proxy_set_header X-Real-IP $client_addr;
            limit_req zone=llm burst=30 nodelay;
            limit_conn addr 20;
            proxy_pass http://open-llm-proxy.biodiversity.svc.cluster.local:8002/v1/chat/completions;
            proxy_set_header Authorization "Bearer ${PROXY_KEY}";

            # Allow long agent loops (multi-turn tool use). 600s keeps the
            # timeout uniform across the whole chain: the geo-agent client
            # defaults to 600s (app/agent.js _llmTimeoutMs) and open-llm-proxy's
            # httpx timeout is 600s, so this sidecar was the odd hop at 300s —
            # cutting off slow-decode models (e.g. glm-5.2) the rest of the
            # chain would still wait for.
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            # Don't buffer streaming responses
            proxy_buffering off;
        }

        location = /api/llm/models {
            limit_except GET { deny all; }
            proxy_set_header X-Real-IP $client_addr;
            limit_req zone=llm burst=30 nodelay;
            limit_conn addr 20;
            proxy_pass http://open-llm-proxy.biodiversity.svc.cluster.local:8002/v1/models;
            proxy_set_header Authorization "Bearer ${PROXY_KEY}";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        location /api/llm/ {
            return 404;
        }

        # Curated STAC catalog (ca-30x30#126). Explicit block because the
        # catch-all below has `try_files ... /index.html`, which would hand
        # back the SPA instead of a 404 for a missing catalog — ca30x30-mcp
        # would then boot degraded with no visible cause.
        location /stac/ {
            alias /usr/share/nginx/html/stac/;
        }

        # Reverse proxy to this app's DuckDB MCP replica. The server requires a
        # bearer token (geo-query#453); nginx attaches it from ${MCP_AUTH_TOKEN}
        # so the browser never holds it, and proxies the in-cluster Service
        # rather than the public hostname (glen-ops#73).
        location /api/mcp {
            proxy_set_header X-Real-IP $client_addr;
            limit_req zone=mcp burst=120 nodelay;
            proxy_pass http://ca30x30-mcp.biodiversity.svc.cluster.local:8000/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host ca30x30-mcp.nrp-nautilus.io;
            proxy_set_header Connection "";
            proxy_set_header Authorization "Bearer ${MCP_AUTH_TOKEN}";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        # The assessment sub-app queries the shared duckdb-mcp rather than
        # this app's replica. Same token, same reason as /api/mcp above.
        location /api/duckdb-mcp {
            proxy_set_header X-Real-IP $client_addr;
            limit_req zone=mcp burst=120 nodelay;
            proxy_pass http://mcp-server-duckdb.biodiversity.svc.cluster.local:8000/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host duckdb-mcp.nrp-nautilus.io;
            proxy_set_header Connection "";
            proxy_set_header Authorization "Bearer ${MCP_AUTH_TOKEN}";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
