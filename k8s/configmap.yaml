# LLM config template — NO SECRETS.
#
# The upstream LLM proxy key lives only in the nginx config (see
# `ca-30x30-nginx` below), which injects the Authorization header
# server-side via `proxy_set_header`. The browser only sees a relative
# `/api/llm` endpoint and never holds the key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ca-30x30-config
  namespace: biodiversity
data:
  config.template.json: |
    {
        "mcp_server_url": "${MCP_SERVER_URL}",
        "llm_model": "deepseek-v4-flash",
        "transcription_model": {
            "value": "gemma-small",
            "endpoint": "/api/llm",
            "api_key": "unused"
        },
        "llm_models": [
            {
                "value": "deepseek-v4-flash",
                "label": "NRP DeepSeek V4 Flash",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "glm-5",
                "label": "NRP GLM-5.2",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "kimi",
                "label": "NRP Kimi",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "qwen3",
                "label": "NRP Qwen3",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "qwen3-small",
                "label": "NRP Qwen3 Small",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "gpt-oss",
                "label": "NRP GPT-OSS 120B",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "minimax-m2",
                "label": "NRP MiniMax M2",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "gemma",
                "label": "NRP Gemma",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "gemma-small",
                "label": "NRP Gemma Small",
                "endpoint": "/api/llm",
                "api_key": "unused"
            }
        ]
    }

---
# Nginx configuration. The shared parts (limits, chat, MCP, tiles, the page and
# the health check) are the snippets in nginx/ of SchmidtDSE/glen-template at the
# tag the Deployment clones, filled in from its env at start-up (glen-ops#340).
# Only this app's own routes belong here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ca-30x30-nginx
  namespace: biodiversity
data:
  nginx.conf.template: |
    include /etc/nginx/glen/limits.conf;

    server {
        listen 80;
        server_name _;

        # /api/mcp and /tiles/ go to this app's own DuckDB MCP replica
        # (ca30x30-mcp, the Deployment's MCP_UPSTREAM).
        include /etc/nginx/glen/base.conf;
        include /etc/nginx/glen/llm.conf;
        include /etc/nginx/glen/mcp.conf;
        include /etc/nginx/glen/spa.conf;

        location /stac/ {
            alias /usr/share/nginx/html/stac/;
        }

        # The assessment sub-app queries the shared duckdb-mcp rather than
        # this app's replica. Same token, same reason as /api/mcp.
        location /api/duckdb-mcp {
            proxy_set_header X-Real-IP $client_addr;
            limit_req zone=mcp burst=120 nodelay;
            proxy_pass http://mcp-server-duckdb.biodiversity.svc.cluster.local:8000/mcp;
            # Tile links name the server's public host, which is gone; send the
            # browser to this app's /duckdb-tiles/ instead.
            proxy_set_header Accept-Encoding "";
            sub_filter 'https://duckdb-mcp.nrp-nautilus.io/tiles/' 'https://$host/duckdb-tiles/';
            sub_filter_once off;
            sub_filter_types text/event-stream application/json;
            proxy_http_version 1.1;
            proxy_set_header Host duckdb-mcp.nrp-nautilus.io;
            proxy_set_header Connection "";
            proxy_set_header Authorization "Bearer ${MCP_AUTH_TOKEN}";
            proxy_set_header X-Glen-App "${GLEN_APP}";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        # Hex tiles from the same server (public there; MCP_AUTH_PUBLIC_TILES).
        location /duckdb-tiles/ {
            limit_except GET { deny all; }
            proxy_pass http://mcp-server-duckdb.biodiversity.svc.cluster.local:8000/tiles/;
            proxy_http_version 1.1;
            proxy_set_header Host duckdb-mcp.nrp-nautilus.io;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $client_addr;
            proxy_set_header X-Glen-App "${GLEN_APP}";
        }
    }

    # STAC-only listener for ca30x30-mcp, which reads this app's catalog
    # in-cluster. Its egress policy (k8s/mcp-egress-networkpolicy.yaml) lets it
    # reach this port only, not the server above. Serves /stac/ read-only and
    # nothing else.
    server {
        listen 8090;
        server_name _;

        location /stac/ {
            alias /usr/share/nginx/html/stac/;
            limit_except GET HEAD { deny all; }
        }

        location / {
            return 404;
        }
    }
