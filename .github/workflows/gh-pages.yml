name: Sync app to GitHub Pages

# Copies the static app onto the root of the orphan `gh-pages` branch, which Pages serves,
# and the no-LLM Assessment Explorer (`assessment/`) to `assessment/` on that branch.
# Only the app files listed below are touched; everything else on that branch (the unlisted
# logs/<uuid>/ pages, robots.txt, README.md) is left alone.
# Without the k8s-injected config.json, the app falls back to the `llm` block in
# layers-input.json: visitors supply their own OpenRouter key.
#
# The root copy redirects to NRP. `wasm/` is a browser-only copy built by
# scripts/build-wasm-copy.py: the visitor's own LLM key, geo-query's tools running in
# the browser on DuckDB-wasm (geo-query-wasm), and the data read from source.coop.

on:
  push:
    branches: [main]
    paths:
      - index.html
      - docs.html
      - layers-input.json
      - system-prompt.md
      - stac/**
      - assets/**
      - assessment/**
      - wasm/**
      - scripts/build-wasm-copy.py
      - .github/workflows/gh-pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Copy app files
        run: |
          rm -rf site/stac site/assets site/assessment site/wasm
          cp app/index.html app/docs.html app/layers-input.json app/system-prompt.md site/
          cp -r app/stac site/stac
          cp -r app/assets site/assets
          cp -r app/assessment site/assessment
          python3 app/scripts/build-wasm-copy.py site/wasm

      - name: Commit and push
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A index.html docs.html layers-input.json system-prompt.md stac assets assessment wasm
          if git diff --cached --quiet; then
            echo "gh-pages already up to date"
          else
            git commit -m "Sync app from main@${GITHUB_SHA::7}"
            git push
          fi
